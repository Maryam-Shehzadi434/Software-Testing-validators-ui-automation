{# Vali the mascot. Usage: {% from "mascot.html" import mascot %}{{ mascot('happy', 160) }}  moods: happy | sad #}
{% macro mascot(mood='happy', size=160) %}
<svg class="mascot {{ mood }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 200 200" role="img" aria-label="Vali the mascot" data-testid="mascot" data-mood="{{ mood }}">
<ellipse cx="100" cy="190" rx="46" ry="6" fill="rgba(0,0,0,.25)"/>
<g class="m-bob">
<line x1="100" y1="46" x2="100" y2="26" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/><circle class="m-tip" cx="100" cy="20" r="8" fill="#fbbf24"/>
<path d="M34 120 Q14 130 22 150" stroke="#7c8cf5" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="22" cy="150" r="8" fill="#fde68a"/>
<g class="m-arm"><path d="M166 120 Q188 110 184 88" stroke="#b79cf5" stroke-width="10" fill="none" stroke-linecap="round"/><circle cx="184" cy="86" r="8" fill="#fde68a"/></g>
<ellipse cx="74" cy="184" rx="17" ry="8" fill="#7a6bd8"/><ellipse cx="126" cy="184" rx="17" ry="8" fill="#7a6bd8"/>
<path d="M100 46C150 46 168 82 168 122C168 162 140 184 100 184C60 184 32 162 32 122C32 82 50 46 100 46Z" fill="url(#vg)"/>
<path d="M62 62C76 52 96 50 112 52" stroke="rgba(255,255,255,.5)" stroke-width="6" fill="none" stroke-linecap="round"/>
<rect x="52" y="76" width="96" height="62" rx="30" fill="#0b1226"/>
<g class="m-eyes"><ellipse cx="80" cy="104" rx="9" ry="11" fill="#67e8f9"/><ellipse cx="120" cy="104" rx="9" ry="11" fill="#67e8f9"/>
<circle cx="83" cy="100" r="3.2" fill="#fff"/><circle cx="123" cy="100" r="3.2" fill="#fff"/></g>
{% if mood == 'sad' %}<path d="M72 90 L90 94M128 90 L110 94" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
<path d="M86 126 Q100 112 114 126" stroke="#67e8f9" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M124 114 q4 7 0 10 q-4 -3 0 -10z" fill="#38bdf8"/>
{% else %}<path d="M84 118 Q100 136 116 118" stroke="#67e8f9" stroke-width="5" fill="none" stroke-linecap="round"/>{% endif %}
<circle cx="64" cy="122" r="6" fill="#f472b6" opacity=".55"/><circle cx="136" cy="122" r="6" fill="#f472b6" opacity=".55"/>
<circle cx="100" cy="160" r="14" fill="rgba(255,255,255,.2)"/>
{% if mood == 'sad' %}<path d="M93 153 L107 167M107 153 L93 167" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
{% else %}<path d="M92 160 l6 6 l11 -12" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>{% endif %}
</g></svg>
{% endmacro %}
