{% extends "auth.html" %}{% block title %}Sign in - Validators Hub{% endblock %}
{% block form %}<h1>Welcome back</h1><p>Sign in to continue to your workspace.</p>
{% if error %}<div class="alert" data-testid="login-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" data-testid="login-form">
<label for="username">Username or email</label><input type="text" id="username" name="username" data-testid="login-username" autocomplete="username">
<label for="password">Password</label><input type="password" id="password" name="password" data-testid="login-password" autocomplete="current-password">
<button type="submit" data-testid="login-submit" style="width:100%">Sign in</button></form>
<p class="muted">New here? <a href="{{ url_for('register') }}" data-testid="login-register-link">Create an account</a></p>{% endblock %}
